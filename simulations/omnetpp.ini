#
# UAV mesh baseline - normal operation, no attack.
#
#   UAV movement -> changing radio conditions -> changing wireless connectivity
#   -> AODV route discovery / route changes -> changing multi-hop packet paths
#   -> UDP communication between the UAVs and the GCS
#
# Nothing here creates, removes or schedules a wireless link or a route.
# Links follow from the radio model and the node positions; routes follow
# from AODV. See README.md for the link budget and the verification steps.
#

[General]
user-interface = Cmdenv
network = uav_mesh_baseline.simulations.UavMeshBaseline
sim-time-limit = 420s
result-dir = results

# Keep all scalar results
**.scalar-recording = true

# Application traffic
*.gcs.app[*].*.vector-recording = true
*.uav*.app[*].*.vector-recording = true

# Wireless MAC behavior
*.gateway.wlan[0].mac.**.vector-recording = true
*.uav*.wlan[0].mac.**.vector-recording = true

# PHY wireless quality: SNIR over time
*.uav*.wlan[0].radio.minSnir.result-recording-modes = +vector
*.gateway.wlan[0].radio.minSnir.result-recording-modes = +vector
*.uav*.wlan[0].radio.minSnir:vector.vector-recording = true
*.gateway.wlan[0].radio.minSnir:vector.vector-recording = true

# Our custom collectors:
# statsUav1..statsUav6 and statsGateway
*.stats*.**.vector-recording = true

# Disable all other vectors
**.vector-recording = false

# Separate RNGs so that MAC randomness cannot perturb anything else.
num-rngs = 3
**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2

# The mobility is deterministic and several nodes are perfectly symmetric,
# so simultaneous transmission starts are possible; treat them as normal.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"


[Config Baseline]
description = "Six UAVs, AODV mesh, wired GCS gateway, 420 s"

# =====================================================================
# 1. Mobility
# =====================================================================
# The gateway and the GCS never move. The six UAVs follow a deterministic
# 3D BonnMotion trace, identical in every run.

*.gcs.mobility.typename = "StationaryMobility"
*.gcs.mobility.initialX = -80m
*.gcs.mobility.initialY = 0m
*.gcs.mobility.initialZ = 0m
*.gcs.mobility.initFromDisplayString = false

*.gateway.mobility.typename = "StationaryMobility"
*.gateway.mobility.initialX = 0m
*.gateway.mobility.initialY = 0m
*.gateway.mobility.initialZ = 2m
*.gateway.mobility.initFromDisplayString = false

*.uav*.mobility.typename = "BonnMotionMobility"
*.uav*.mobility.traceFile = "mobility/uav_mobility.trace"
*.uav*.mobility.is3D = true
*.uav*.mobility.updateInterval = 0.1s
# Line n of the trace file drives uavN.
*.uav1.mobility.nodeId = 0
*.uav2.mobility.nodeId = 1
*.uav3.mobility.nodeId = 2
*.uav4.mobility.nodeId = 3
*.uav5.mobility.nodeId = 4
*.uav6.mobility.nodeId = 5

# =====================================================================
# 2. Radio - commodity 2.4 GHz IEEE 802.11g hardware
# =====================================================================
# Transmit power, sensitivity and antenna are datasheet values; the
# resulting communication range is a consequence, not an input:
#
#   free space path loss constant at 2.412 GHz .... 40.1 dB
#   link budget  20 dBm - (-74 dBm) ............... 94.0 dB
#   => usable range ............................... ~496 m
#
# Against the scenario geometry that means the gateway hears whoever
# occupies the P1/P2/P3 regions (179 m / 353 m / 353 m) and cannot hear
# P4/P5/P6 (550 m / 569 m / 550 m), so those UAVs must relay through the
# air. See README.md for the full distance table.

*.uav*.wlan[0].opMode = "g(erp)"
*.uav*.wlan[0].bitrate = 48Mbps
*.gateway.wlan[0].opMode = "g(erp)"
*.gateway.wlan[0].bitrate = 48Mbps

# 100 mW transmitter, 0 dBi omnidirectional antenna
**.wlan[0].radio.transmitter.power = 100mW
**.wlan[0].radio.antenna.typename = "IsotropicAntenna"

# receiver: -74 dBm sensitivity (typical 802.11g chipset at 48 Mbps),
# carrier sense deliberately wider than the decode range
**.wlan[0].radio.receiver.sensitivity = -74dBm
**.wlan[0].radio.receiver.energyDetection = -85dBm
**.wlan[0].radio.receiver.snirThreshold = 4dB

# medium: unobstructed air-to-air / air-to-ground line of sight
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.radioMedium.pathLoss.alpha = 2
*.radioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
*.radioMedium.backgroundNoise.power = -96dBm
# make the range circles drawn by the visualizer match the real -74 dBm
# sensitivity instead of Ieee80211RadioMedium's -85 dBm default
*.radioMedium.mediumLimitCache.minReceptionPower = -74dBm

# =====================================================================
# 3. Addressing and routing
# =====================================================================
#   10.0.0.0/30  fixed wired GCS <-> gateway network
#   10.1.0.0/24  airborne wireless network
#
# Only the wired side is configured statically. Everything inside the
# airborne network is left entirely to AODV.

*.configurator.addStaticRoutes = false
*.configurator.config = xml("<config>\
    <interface hosts='gcs'     names='eth0'  address='10.0.0.1'  netmask='255.255.255.252'/>\
    <interface hosts='gateway' names='eth0'  address='10.0.0.2'  netmask='255.255.255.252'/>\
    <interface hosts='gateway' names='wlan0' address='10.1.0.1'  netmask='255.255.255.0'/>\
    <interface hosts='uav1'    names='wlan0' address='10.1.0.11' netmask='255.255.255.0'/>\
    <interface hosts='uav2'    names='wlan0' address='10.1.0.12' netmask='255.255.255.0'/>\
    <interface hosts='uav3'    names='wlan0' address='10.1.0.13' netmask='255.255.255.0'/>\
    <interface hosts='uav4'    names='wlan0' address='10.1.0.14' netmask='255.255.255.0'/>\
    <interface hosts='uav5'    names='wlan0' address='10.1.0.15' netmask='255.255.255.0'/>\
    <interface hosts='uav6'    names='wlan0' address='10.1.0.16' netmask='255.255.255.0'/>\
    <route hosts='gcs' destination='10.1.0.0' netmask='255.255.255.0' interface='eth0' gateway='10.0.0.2'/>\
    </config>")

# That single manual route is the only one the network needs beyond the
# automatic ones: it tells the GCS to reach the airborne network through the
# gateway. Every node's own directly attached subnets (10.0.0.0/30 on eth0,
# 10.1.0.0/24 on wlan0, 127.0.0.0/8) come from Ipv4RoutingTable's automatic
# netmask routes, and everything inside 10.1.0.0/24 comes from AODV.

# The AODV nodes own their own routing tables - the configurator must not
# write into them.
*.uav*.ipv4.configurator.configureRoutingTable = false
*.gateway.ipv4.configurator.configureRoutingTable = false

# The automatic "my own subnet is directly reachable" route (10.1.0.0/24 via
# wlan0) is deliberately KEPT on the wireless nodes. It must be present:
# AODV's external-gateway feature installs a 0.0.0.0/0 route towards the
# gateway, and 0.0.0.0/0 also matches airborne destinations. Without a more
# specific /24 entry, a UAV forwarding a GCS->UAV packet picks the default
# route and sends the packet back to the gateway, which sends it out again -
# the packet loops until its TTL expires.
#
# Keeping the /24 does not let IPv4 bypass AODV: the /24 carries no
# AodvRouteData, so AODV's pre-routing hook still treats it as "no active
# route", buffers the packet and starts a route discovery. The /24 only
# ensures that longest-prefix match never falls through to 0.0.0.0/0 for an
# address inside the airborne network.

# --- AODV (RFC 3561 defaults except for the gateway address) ---------
# Traffic to addresses outside 10.1.0.0/24 (i.e. the GCS) is routed via an
# AODV-maintained default route towards the gateway's wireless address.
**.aodv.gatewayAddress = "10.1.0.1"
**.aodv.interface = "wlan0"
# No periodic HELLOs: link breaks are detected from 802.11 retry
# exhaustion, which is both more realistic and faster.
**.aodv.useHelloMessages = false

# Real ARP (INET default) - IP-to-MAC resolution actually happens on the air.
**.arp.typename = "Arp"

# =====================================================================
# 4. Applications
# =====================================================================
# Generic UDP payloads. They carry no MAVLink, no encoded telemetry fields
# and no flight commands - only the size, direction and rate of such traffic.
#
#   UAV -> GCS  telemetry-like  10 pkt/s, 200 B, UDP port 5000
#   GCS -> UAV  command-like     2 pkt/s, 100 B, UDP port 5001
#
# Traffic starts at t = 30 s, after the initial stationary period.
# Start times are staggered by 10 ms per UAV so the six periodic streams
# do not fire on identical timestamps forever.

*.uav*.numApps = 2

*.uav*.app[0].typename = "UdpBasicApp"
*.uav*.app[0].destAddresses = "10.0.0.1"
*.uav*.app[0].destPort = 5000
*.uav*.app[0].messageLength = 200B
*.uav*.app[0].sendInterval = 0.1s
*.uav*.app[0].packetName = "UavTelemetry"
*.uav1.app[0].startTime = 30.00s
*.uav2.app[0].startTime = 30.01s
*.uav3.app[0].startTime = 30.02s
*.uav4.app[0].startTime = 30.03s
*.uav5.app[0].startTime = 30.04s
*.uav6.app[0].startTime = 30.05s

*.uav*.app[1].typename = "UdpSink"
*.uav*.app[1].localPort = 5001

# The GCS: one sink for all telemetry plus one sender per UAV. Separate
# senders are needed because a single UdpBasicApp with a destination list
# picks a random destination per packet and would not give 2 pkt/s each.
*.gcs.numApps = 7

*.gcs.app[0].typename = "UdpSink"
*.gcs.app[0].localPort = 5000

*.gcs.app[1..6].typename = "UdpBasicApp"
*.gcs.app[1..6].destPort = 5001
*.gcs.app[1..6].messageLength = 100B
*.gcs.app[1..6].sendInterval = 0.5s
*.gcs.app[1..6].packetName = "GcsCommand"
*.gcs.app[1].destAddresses = "10.1.0.11"
*.gcs.app[2].destAddresses = "10.1.0.12"
*.gcs.app[3].destAddresses = "10.1.0.13"
*.gcs.app[4].destAddresses = "10.1.0.14"
*.gcs.app[5].destAddresses = "10.1.0.15"
*.gcs.app[6].destAddresses = "10.1.0.16"
*.gcs.app[1].startTime = 30.00s
*.gcs.app[2].startTime = 30.05s
*.gcs.app[3].startTime = 30.10s
*.gcs.app[4].startTime = 30.15s
*.gcs.app[5].startTime = 30.20s
*.gcs.app[6].startTime = 30.25s

# =====================================================================
# 5. Qtenv visualization (no NetAnim)
# =====================================================================
# Every visualizer below only reads state. None of them creates or
# modifies a wireless link or a route.

# --- scene: the layout spans x in [-80, 560] and y in [-150, 150] ----
*.visualizer.sceneVisualizer[0].sceneMinX = -150m
*.visualizer.sceneVisualizer[0].sceneMaxX = 650m
*.visualizer.sceneVisualizer[0].sceneMinY = -250m
*.visualizer.sceneVisualizer[0].sceneMaxY = 250m
*.visualizer.sceneVisualizer[0].sceneMinZ = 0m
*.visualizer.sceneVisualizer[0].sceneMaxZ = 150m
*.visualizer.sceneVisualizer[0].axisLength = 100m

# --- UAV movement, direction and trajectories -----------------------
*.visualizer.mobilityVisualizer[0].displayMobility = true
*.visualizer.mobilityVisualizer[0].displayPositions = true
*.visualizer.mobilityVisualizer[0].displayOrientations = true
*.visualizer.mobilityVisualizer[0].displayVelocities = true
*.visualizer.mobilityVisualizer[0].displayMovementTrails = true
*.visualizer.mobilityVisualizer[0].trailLength = 200

# --- wireless activity and reach ------------------------------------
*.visualizer.mediumVisualizer[0].displaySignals = true
*.visualizer.mediumVisualizer[0].displaySignalDepartures = true
*.visualizer.mediumVisualizer[0].displaySignalArrivals = true
*.visualizer.mediumVisualizer[0].displayCommunicationRanges = true

# --- one-hop frame exchanges, coloured per AODV message type --------
*.visualizer.numDataLinkVisualizers = 4
*.visualizer.dataLinkVisualizer[*].displayLinks = true
*.visualizer.dataLinkVisualizer[*].activityLevel = "peer"
*.visualizer.dataLinkVisualizer[0].packetFilter = "*Rreq*"
*.visualizer.dataLinkVisualizer[0].lineColor = "green"
*.visualizer.dataLinkVisualizer[1].packetFilter = "*Rrep*"
*.visualizer.dataLinkVisualizer[1].lineColor = "blue"
*.visualizer.dataLinkVisualizer[2].packetFilter = "*Rerr*"
*.visualizer.dataLinkVisualizer[2].lineColor = "red"
*.visualizer.dataLinkVisualizer[3].packetFilter = "UavTelemetry* or GcsCommand*"
*.visualizer.dataLinkVisualizer[3].lineColor = "black"

# --- the actual end-to-end path each data packet takes ---------------
*.visualizer.networkRouteVisualizer[0].displayRoutes = true
*.visualizer.networkRouteVisualizer[0].packetFilter = "UavTelemetry* or GcsCommand*"

# --- the AODV next hop each node currently holds towards the GCS -----
# These arrows re-point whenever AODV replaces a route.
*.visualizer.routingTableVisualizer[0].displayRoutingTables = true
*.visualizer.routingTableVisualizer[0].destinationFilter = "gcs"
*.visualizer.routingTableVisualizer[0].displayRoutesIndividually = false

# --- addresses on the nodes -----------------------------------------
*.visualizer.interfaceTableVisualizer[0].displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer[0].format = "%N %a"


[Config BaselineIsometric]
description = "Baseline seen from an isometric angle (shows the altitude layering)"
extends = Baseline
# The UAVs cruise at 100 m, climb to 120 m when leaving the P1 region and
# descend to 80 m when entering it, so reciprocal flights never share a
# 3D point. That separation is invisible in the default top-down view.
*.visualizer.sceneVisualizer[0].viewAngle = "isometric"
